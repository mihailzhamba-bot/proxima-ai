#:schema https://developers.openai.com/codex/config-schema.json

[apps._default]
enabled = false

[mcp_servers.jira-atlassian]
enabled = true
required = true
# Портативный транспорт (2026-09-20): работает на macOS и Linux (npx в PATH).
# OAuth-токены mcp-remote лежат в ~/.mcp-auth и переносятся на новые хосты отдельно.
command = "npx"
args = ["-y", "mcp-remote@0.1.37", "https://mcp.atlassian.com/v1/mcp"]
startup_timeout_sec = 60
enabled_tools = [
  "getAccessibleAtlassianResources",
  "getJiraIssue",
  "searchJiraIssuesUsingJql",
]
default_tools_approval_mode = "approve"

[mcp_servers.node_repl]
enabled = true
# required = false (2026-09-20): Linux не имеет ChatGPT node_repl, поэтому в репо
# лежит shim .codex/mcp-node-repl.mjs (инструмент "js" через node:vm) с
# относительным путём - работает из коробки на macOS и Linux.
# macOS может переопределить транспорт в ~/.codex/config.toml (ChatGPT.app).
required = false
command = "node"
args = [".codex/mcp-node-repl.mjs"]
enabled_tools = ["js"]
default_tools_approval_mode = "approve"

[mcp_servers.computer-use]
enabled = false
# dummy-транспорт: убирает "invalid transport" на свежих Linux-хостах
command = "node"
args = ["--version"]

# NOTE (2026-08-27): не объявляйте [mcp_servers.X] с "enabled = false" без
# command/url, если X не определён в ~/.codex/config.toml - Codex v0.150.x
# валидирует транспорт у всех объявленных серверов и падает с
# "invalid transport" (ловилось на granola/klaviyo/linear/shopify-storefront).
# (2026-09-20) поэтому всем disabled-записям ниже добавлены dummy-транспорты
# "node --version": конфиг проекта теперь валиден на хостах с пустым
# ~/.codex/config.toml. На macOS записи по-прежнему отключены.

[mcp_servers.notebooklm]
enabled = false
command = "node"
args = ["--version"]

[mcp_servers.omnisearch]
enabled = false
command = "node"
args = ["--version"]

[mcp_servers.openaiDeveloperDocs]
enabled = false
url = "https://developers.openai.com/mcp"

[mcp_servers.web-reader]
enabled = false
command = "node"
args = ["--version"]

[mcp_servers.web-search-prime]
enabled = false
command = "node"
args = ["--version"]

[mcp_servers.zai-mcp-server]
enabled = false
command = "node"
args = ["--version"]

[mcp_servers.zread]
enabled = false
command = "node"
args = ["--version"]
