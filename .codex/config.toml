#:schema https://developers.openai.com/codex/config-schema.json

[apps._default]
enabled = false

[mcp_servers.jira-atlassian]
enabled = true
required = true
enabled_tools = [
  "getAccessibleAtlassianResources",
  "getJiraIssue",
  "searchJiraIssuesUsingJql",
]
default_tools_approval_mode = "approve"

[mcp_servers.node_repl]
enabled = true
required = true
enabled_tools = ["js"]
default_tools_approval_mode = "approve"

[mcp_servers.computer-use]
enabled = false

# NOTE (2026-08-27): не объявляйте [mcp_servers.X] с "enabled = false" без
# command/url, если X не определён в ~/.codex/config.toml - Codex v0.150.x
# валидирует транспорт у всех объявленных серверов и падает с
# "invalid transport" (ловилось на granola/klaviyo/linear/shopify-storefront).

[mcp_servers.notebooklm]
enabled = false

[mcp_servers.omnisearch]
enabled = false

[mcp_servers.openaiDeveloperDocs]
enabled = false

[mcp_servers.web-reader]
enabled = false

[mcp_servers.web-search-prime]
enabled = false

[mcp_servers.zai-mcp-server]
enabled = false

[mcp_servers.zread]
enabled = false
