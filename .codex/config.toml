[mcp_servers.granola]
enabled = false

[mcp_servers.klaviyo]
enabled = false

[mcp_servers.linear]
enabled = false

[mcp_servers.notebooklm]
enabled = false

[mcp_servers.omnisearch]
enabled = false

[mcp_servers.openaiDeveloperDocs]
enabled = false

[mcp_servers.shopify-storefront]
enabled = false

[mcp_servers.web-reader]
enabled = false

[mcp_servers.web-search-prime]
enabled = false

[mcp_servers.zai-mcp-server]
enabled = false

[mcp_servers.zread]
