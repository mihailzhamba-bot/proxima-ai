#:schema https://developers.openai.com/codex/config-schema.json

[apps._default]
enabled = false

[mcp_servers.jira-atlassian]
enabled = true
required = true
enabled_tools = [
  "getAccessibleAtlassianResources",
  "getJiraIssue",
  "searchJiraIssuesUsingJql",
]
# 2026-08-28: `codex mcp list` / runtime tool discovery expose no installed
# Jira write tool. Keep the allowlist read-only; `/now` must return BLOCKED
# rather than inventing a write tool name.
default_tools_approval_mode = "approve"

[mcp_servers.node_repl]
enabled = true
required = true
enabled_tools = ["js"]
default_tools_approval_mode = "approve"

# Выключенные серверы: блок без transport валиден ТОЛЬКО для имён, определённых
# в ~/.codex/config.toml (transport наследуется оттуда). Голый блок неизвестного
# имени (бывший granola) роняет загрузку всего конфига: invalid transport.
# Проверка: `codex mcp list` из корня репо (без вызова модели).

[mcp_servers.computer-use]
enabled = false

[mcp_servers.notebooklm]
enabled = false

[mcp_servers.omnisearch]
enabled = false

[mcp_servers.openaiDeveloperDocs]
enabled = false

[mcp_servers.web-reader]
enabled = false

[mcp_servers.web-search-prime]
enabled = false

[mcp_servers.zai-mcp-server]
enabled = false

[mcp_servers.zread]
enabled = false

# Codex MCP-конфиг проекта PROXIMA AI (project-scoped).
# DATABASE_URI берётся из окружения запускающего shell (туннель к VPS - см. AGENTS.md);
# секреты никогда не коммитятся. Эквивалент CLI-добавления:
