# Installed only after bootstrap-vps.sh has created proxima-admin and validated its SSH key.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding local
GatewayPorts no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers proxima-admin
