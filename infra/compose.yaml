name: proxima-ai

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proxima
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PROXIMA_POSTGRES_PORT:-5432}:5432"
      - "172.17.0.1:5432:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d proxima"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job containers (AD-6/AD-15). `run --rm --profile jobs`, never `up`.
  # Secret-файлы на хосте - 1010:1010 0600 (AD-6), compose биндит их как есть.
  collector:
    build:
      context: ..
      dockerfile: services/collector/Dockerfile
    profiles: ["jobs"]
    environment:
      COLLECTOR_DATABASE_URI_FILE: /run/secrets/proxima_collector_uri
      PROXIMA_RAW_DIR: /srv/proxima-ai/raw
      # AD-4: the WB transport is fail-closed (services/collector/src/wb/transport.ts); only this
      # job container opts in - not jobs.env (SAFE_ENV_KEYS allowlist), not units, never tests.
      # Fix 08.09.2026 (first live `collect` failed on WB_NETWORK_FORBIDDEN); gate: make live-network.
      WB_ALLOW_LIVE_NETWORK: "1"
    secrets:
      - proxima_collector_uri
      - amirova-test_wb_statistics_token
      - amirova-test_wb_analytics_token
    env_file:
      - jobs.env
    volumes:
      # Host-side edits to jobs.env apply on the next `compose run` without a rebuild.
      - ../infra/jobs.env:/app/infra/jobs.env:ro
      - ${PROXIMA_RAW_DIR:?set PROXIMA_RAW_DIR}:/srv/proxima-ai/raw
    networks:
      - private
    restart: "no"

  control-plane:
    build:
      context: ..
      dockerfile: services/control-plane/Dockerfile
    profiles: ["jobs"]
    environment:
      NORM_DATABASE_URI_FILE: /run/secrets/proxima_norm_uri
    secrets:
      - proxima_norm_uri
    env_file:
      - jobs.env
    volumes:
      - ../infra/jobs.env:/app/infra/jobs.env:ro
    networks:
      - private
    restart: "no"

  # Owner-секреты живут только здесь (AD-15): apply-migrations.
  # Analytics-токен и raw-каталог нужны этому же образу для FUNNEL_CSV_DOWNLOAD.
  # TODO (Story 1.12/AD-11): proxima_janitor_uri → JANITOR_DATABASE_URI_FILE - смонтировать
  # при заведении janitor-сервиса; имя секрета по Conventions.
  control-plane-admin:
    build:
      context: ..
      dockerfile: services/control-plane/Dockerfile
    profiles: ["jobs"]
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PROXIMA_RAW_DIR: /srv/proxima-ai/raw
      WB_ANALYTICS_TOKEN_FILE: /run/secrets/amirova-test_wb_analytics_token
    secrets:
      - postgres_user
      - postgres_password
      - amirova-test_wb_analytics_token
    env_file:
      - jobs.env
    volumes:
      - ../infra/jobs.env:/app/infra/jobs.env:ro
      - ${PROXIMA_RAW_DIR:?set PROXIMA_RAW_DIR}:/srv/proxima-ai/raw
    networks:
      - private
    restart: "no"

networks:
  private:
    name: proxima-ai-private

volumes:
  postgres-data:

secrets:
  postgres_user:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/postgres_user
  postgres_password:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/postgres_password
  proxima_collector_uri:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/proxima_collector_uri
  proxima_norm_uri:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/proxima_norm_uri
  amirova-test_wb_statistics_token:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/amirova-test_wb_statistics_token
  amirova-test_wb_analytics_token:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/amirova-test_wb_analytics_token
