name: proxima-ai

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: proxima
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PROXIMA_POSTGRES_PORT:-5432}:5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d proxima"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  private:
    internal: true

volumes:
  postgres-data:

secrets:
  postgres_user:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/postgres_user
  postgres_password:
    file: ${PROXIMA_SECRETS_DIR:?set PROXIMA_SECRETS_DIR}/postgres_password
