# Scoped to the new account: do not constrain existing administrator logins.
Match User loop-runner-tunnel
    AllowUsers loop-runner-tunnel@135.106.211.64
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowAgentForwarding no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:18770
    PermitListen none
    GatewayPorts no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 0
    ForceCommand /usr/sbin/nologin
Match all
