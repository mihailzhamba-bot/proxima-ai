name: loop-control
# Build on Harper, pull digest-pinned artifacts here. No build stanza on control.
x-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
services:
  postgres:
    image: ${LOOP_POSTGRES_IMAGE:?digest-pinned postgres16.6 image required}
    restart: unless-stopped
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 128
    logging: *bounded-logging
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin
    volumes:
      - postgres:/var/lib/postgresql/data
      - /etc/loop/secrets/postgres_admin:/run/secrets/postgres_admin:ro
      - /etc/loop/secrets/paperclip_postgres:/run/secrets/paperclip_postgres:ro
      - /etc/loop/10-paperclip-role.sh:/docker-entrypoint-initdb.d/10-paperclip-role.sh:ro
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
  paperclip:
    logging: *bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    image: ${LOOP_PAPERCLIP_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      HOME: /paperclip
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_CONFIG: /paperclip/instances/default/config.json
      PORT: "3100"
      HOST: "0.0.0.0"
    env_file: /etc/loop/paperclip.env
    volumes: [paperclip:/paperclip]
    networks: [control]
    ports: ["127.0.0.1:3100:3100"]
  hermes:
    logging: *bounded-logging
    image: ${LOOP_HERMES_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 2g
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    environment:
      HERMES_HOME: /var/lib/loop/hermes
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
    env_file: /etc/loop/director.env
    volumes: ["hermes:/var/lib/loop/hermes", "/etc/loop/hermes.yaml:/var/lib/loop/hermes/config.yaml:ro", "/etc/loop/secrets/hermes_bridge_director:/run/secrets/bridge_director:ro"]
    networks: [control]
  bridge:
    logging: *bounded-logging
    image: ${LOOP_BRIDGE_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
    volumes: ["bridge:/var/lib/loop/bridge", "/etc/loop/bridge.json:/etc/loop/bridge.json:ro", "/etc/loop/secrets/bridge_operator:/run/secrets/bridge_operator:ro", "/etc/loop/secrets/bridge_gateway:/run/secrets/bridge_gateway:ro", "/etc/loop/secrets/bridge_director:/run/secrets/bridge_director:ro", "/etc/loop/secrets/bridge_runner:/run/secrets/bridge_runner:ro", "/etc/loop/secrets/hermes_api:/run/secrets/hermes_api:ro", "/etc/loop/secrets/paperclip_board:/run/secrets/paperclip_board:ro", "/etc/loop/secrets/openhands_api:/run/secrets/openhands_api:ro", "/etc/loop/secrets/github_pr:/run/secrets/github_pr:ro", "/etc/loop/secrets/webapp_context:/run/secrets/webapp_context:ro"]
    networks: [control]
    ports: ["127.0.0.1:18770:18770"]
    command: ["python3", "/opt/loop/bridge.py", "--config", "/etc/loop/bridge.json"]
  telegram:
    image: ${LOOP_BRIDGE_IMAGE:?digest-pinned image required}
    restart: unless-stopped
    init: true
    read_only: true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    logging: *bounded-logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: ["telegram:/var/lib/loop/telegram", "/etc/loop/telegram.json:/etc/loop/telegram.json:ro", "/etc/loop/secrets/telegram_bot:/run/secrets/telegram_bot:ro", "/etc/loop/secrets/bridge_operator:/run/secrets/bridge_operator:ro"]
    networks: [control]
    command: ["python3", "/opt/loop/telegram.py", "--config", "/etc/loop/telegram.json"]
networks:
  control: {}
volumes:
  postgres: {}
  telegram: {}
  paperclip: {}
  hermes: {}
  bridge: {}
