# Rehearsal override публичного контура на стенде proxima-rehearsal
# (runbook release-m03.md §3b, 27-28.09). Применяется ПОСЛЕДНИМ:
#   docker compose -p proxima-rehearsal --env-file .env.rehearsal \
#     -f infra/compose.yaml -f infra/compose.rehearsal.yaml \
#     -f infra/webapp.compose.yaml -f infra/webapp.rehearsal.compose.yaml \
#     up -d webapp caddy
# НЕ для боя: внутренний CA, порты только на loopback, auth env-file -
# изолированный файл репетиции (PROXIMA_WEBAPP_AUTH_ENV_FILE в .env.stand),
# регистрация открыта - на стенде создаётся первый пользователь.
# Staging-overlay (webapp.staging.compose.yaml) в этой сборке НЕ участвует:
# он определяет тот же сервис webapp.

services:
  webapp:
    environment:
      WEBAPP_ALLOW_SIGNUP: "1"

  caddy:
    ports: !override
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes: !override
      - ./Caddyfile.rehearsal:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
