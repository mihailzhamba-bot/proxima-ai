# PA-39 import allowlist: Опрос-v2.2 -> PROXIMA AI monorepo
#
# Правило (STATE.md §Source Boundaries + AGENTS.md §Жёсткие запреты п.4):
# импорт только по этому allowlist. PA-41 обязан пересчитать SHA-256 каждого
# файла в source worktree НЕПОСРЕДСТВЕННО перед копированием; любое несовпадение
# с этим файлом = abort импорта, а не «скопируем всё равно».
#
# Source worktree НЕ мутировать: ни stash, ни clean, ни commit (аудит PA-39
# подтверждает источник чистым на момент снятия хэшей).
#
# Волны:
#   W1-deterministic-core - чистый срез: engine + contracts + evals + тесты +
#     fixtures. Внешние зависимости: pydantic + stdlib. Не ждёт PMM-29 в части
#     verbatim-копии (см. audit §Adaptation о двухкоммитной схеме).
#   W2-llm-slice - orchestrator + ai/* + тесты. Зависит от контрактов PMM-29
#     (adaptation-коммит) и от адаптации settings.
#
# destination_root = services/control-plane (решение grill-сеанса 2026-08-23).
# Структура tests/ + evals/ переносится как есть: Path(__file__).parents[3]
# в тестах указывает на services/control-plane - пути не требуют правок.

