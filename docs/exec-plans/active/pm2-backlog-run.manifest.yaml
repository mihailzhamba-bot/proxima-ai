# pm2-backlog-run.manifest.yaml — единственный источник правды по прогону PMM
# Прогон: 2026-08-17, срез M2/M3 при 1 FTE (протокол ai-marketplace-os, правило capacity).
# Обновляется после каждой фазы. Не править руками во время активной сессии прогона.

run:
  id: aios-run-2026-08-17
  started_at: 2026-08-17
  operator: Mike + orchestrator (Claude, jira-atlassian MCP)
  jira_base_url: https://zhamba.atlassian.net
  project_key: PMM                  # company-managed, id 10043, проверено
  ops_project_key: deferred_to_R4   # решение Mike 2026-08-17

preflight:
  project_type: company-managed
  hierarchy_above_epic: false       # → инициатива = label init-m2 + управляющая задача
  issue_types_available: [Эпик, История, Задача, Подзадача, Баг]
  missing_types: [Spike, Risk, Initiative]  # → Задача + label spike / risk / init-*
  can_create_components: false      # нет MCP-endpoint; label comp-* (создание в UI — пост-фактум)
  can_create_versions: false        # аналогично; label rel-r0
  can_manage_sprints: false         # не используется: velocity неизвестна, дат нет
  bulk_create_supported: false      # MCP создаёт по одному; один батч 28
  wbs_field: label
  api_rate_limit_note: "MCP jira-atlassian, throttling не наблюдалось 2026-08-17"

inputs:
  engineers_fte: 1                  # правило capacity: срез, подтверждено Mike 2026-08-17
  roles_present: [product, data]    # + AI-ops в найме; backend-пропуск агентов не подтверждён
  known_velocity: null              # → никаких дат; baseline velocity — задача DEL-001
  tax_regime: UNKNOWN               # до ADR спайка FIN-001; mixed отвергнут как «диагноз незнания»
  legal_entities: 4+                # точный перечень и режимы — вход спайка FIN-001
  cogs_source: sheets-am-onboarding
  marketplaces_now: [wildberries]   # Ozon исключён из среза (решение Mike 2026-08-17)

fallbacks_applied:
  - condition: нет уровня выше Epic (Initiative)
    decision: инициатива M2 = label init-m2 + управляющая задача AIOS-PROD-000
    assumption_issue: AIOS-PROD-003
  - condition: нет issue type Spike/Risk
    decision: Задача + label spike / risk
    assumption_issue: AIOS-PROD-003
  - condition: нет MCP-endpoint создания компонентов
    decision: компонент = label comp-<name> (governance / w1-slice / delivery / finance)
    assumption_issue: AIOS-PROD-003
  - condition: нет MCP-endpoint создания версий
    decision: версия = label rel-r0
    assumption_issue: AIOS-PROD-003
  - condition: приоритеты Jira 5-уровневые, не P0-P3
    decision: P0→Highest, P1→High, P2→Medium, P3→Low
    assumption_issue: AIOS-PROD-003
  - condition: velocity неизвестна
    decision: без дат; порядок спринтов + задача замера baseline (DEL-001)
    assumption_issue: AIOS-DEL-001
  - condition: ops-проект отсутствует
    decision: отложен до R4; STUB-маркер AIOS-PROD-007
    assumption_issue: AIOS-PROD-007
  - condition: Ozon вне видения Proxima до M3+
    decision: исключён из среза; STUB-маркер AIOS-PROD-006
    assumption_issue: AIOS-PROD-006

