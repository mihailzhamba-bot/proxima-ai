[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proxima-control-plane"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.4",
    "uvicorn==0.52.3",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "jsonschema==4.25.1", "psycopg[binary]==3.3.4", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxima_control_plane"]
