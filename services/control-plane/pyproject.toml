[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proxima-control-plane"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic==2.13.4", "jsonschema==4.25.1", "psycopg[binary]==3.3.4"]

[project.optional-dependencies]
# `llm` зарезервирована под SDK реального провайдера (PMM-31); сознательно пустая.
llm = []
test = ["httpx==0.28.1", "psycopg[binary]==3.3.4", "pytest==8.4.2", "rfc3339-validator==0.1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/proxima_control_plane", "src/proxima"]
