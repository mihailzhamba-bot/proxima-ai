<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROXIMA AI — карта проекта · 22.08.2026</title>
<style>
  :root{ --ink:#0f172a; --muted:#64748b; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%; overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(1400px 900px at 50% 38%, #ffffff 0%, #f6f7fb 55%, #ecedf4 100%);
    color:var(--ink);
  }
  #viewport{position:absolute; inset:0; cursor:grab; overflow:hidden}
  #viewport.dragging{cursor:grabbing}
  #world{position:absolute; left:0; top:0; width:3400px; height:2600px; transform-origin:0 0}
  #edges{position:absolute; left:0; top:0; pointer-events:none}

  /* ---------- зоны ---------- */
  .zone{position:absolute; --zc:#2563eb}
  .zone .head{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--zc); color:#fff; font-weight:700; font-size:15px;
    letter-spacing:.05em; text-transform:uppercase;
    padding:10px 14px; border-radius:10px; cursor:pointer;
    box-shadow:0 3px 10px rgba(15,23,42,.18);
    transition:filter .15s;
  }
  .zone .head:hover{filter:brightness(1.08)}
  .zone .head .meta{display:flex; align-items:center; gap:8px}
  .zone .head .cnt{
    background:rgba(255,255,255,.22); border-radius:999px; padding:1px 9px;
    font-size:12px; font-weight:600; letter-spacing:0;
  }
  .zone .head .chev{display:inline-block; transition:transform .2s; font-size:13px}
  .zone .head.collapsed .chev{transform:rotate(-90deg)}
  .zone .items{
    margin-top:12px; margin-left:14px; padding-left:18px;
    border-left:3px solid var(--zc);
    display:flex; flex-direction:column; gap:10px;
  }
  .zone .item{
    position:relative; background:#fff; border:1px solid #e2e8f0;
    border-left:4px solid var(--zc); border-radius:9px;
    padding:9px 12px; font-size:13.5px; line-height:1.45;
    max-width:400px; white-space:pre-line;
    box-shadow:0 1px 2px rgba(15,23,42,.07);
    transition:transform .15s, box-shadow .15s;
  }
  .zone .item:hover{transform:translateY(-1px); box-shadow:0 4px 12px rgba(15,23,42,.13)}
  .zone .item::before{
    content:""; position:absolute; left:-18px; top:50%; width:18px; height:3px;
    background:var(--zc);
  }
  .zone[data-side="B"] .item{max-width:780px}

  /* ---------- хаб ---------- */
  .hub{
    position:absolute; z-index:5; text-align:center;
    background:linear-gradient(140deg,#4c1d95 0%, #6d28d9 60%, #5b21b6 100%);
    color:#fff; border-radius:18px; padding:24px 30px;
    box-shadow:0 14px 40px rgba(76,29,149,.4);
    max-width:400px;
  }
  .hub h1{font-size:27px; font-weight:800; letter-spacing:.02em}
  .hub .sub{font-size:14px; color:#ddd6fe; margin-top:6px}
  .hub .chain{
    display:inline-block; margin-top:12px; background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.25); border-radius:999px;
    padding:6px 14px; font-size:14px; font-weight:600;
  }
  .hub .date{font-size:11.5px; color:#c4b5fd; margin-top:10px}

  /* ---------- оверлей ---------- */
  .overlay{position:fixed; z-index:50; pointer-events:none}
  #titlebar{top:14px; left:18px}
  #titlebar .t{font-size:16px; font-weight:800}
  #titlebar .h{font-size:12px; color:var(--muted); margin-top:3px}
  #controls{top:14px; right:18px; display:flex; gap:8px; pointer-events:auto}
  #controls button{
    font:600 13px/1 inherit; color:var(--ink); background:#fff;
    border:1px solid #d7dbe4; border-radius:9px; padding:9px 13px; cursor:pointer;
    box-shadow:0 2px 8px rgba(15,23,42,.1);
  }
  #controls button:hover{background:#f1f3f9}
  #legend{
    bottom:14px; left:18px; background:#fff; border:1px solid #e2e8f0;
    border-radius:10px; padding:10px 14px; font-size:12px; color:#334155;
    box-shadow:0 2px 10px rgba(15,23,42,.08);
  }
  #legend .row{display:flex; align-items:center; gap:8px; margin-top:5px}
  #legend .row:first-child{margin-top:0}
  #legend .dot{width:11px; height:11px; border-radius:3px; flex:none}
  #legend .src{margin-top:8px; color:#94a3b8; font-size:10.5px}
</style>
</head>
<body>

<div id="viewport">
  <div id="world">
    <svg id="edges" width="3400" height="2600" viewBox="0 0 3400 2600"></svg>
  </div>
</div>

<div class="overlay" id="titlebar">
  <div class="t">PROXIMA AI · карта проекта</div>
  <div class="h">колесо — зум · перетаскивание — панорама · клик по заголовку зоны — свернуть</div>
</div>

<div class="overlay" id="controls">
  <button id="btnAll" title="свернуть или развернуть все зоны">свернуть зоны</button>
  <button id="btnFit" title="вписать в экран">вписать</button>
  <button id="btnIn" title="приблизить">+</button>
  <button id="btnOut" title="отдалить">−</button>
</div>

<div class="overlay" id="legend">
  <div class="row"><span class="dot" style="background:#16a34a"></span>сделано / работает</div>
  <div class="row"><span class="dot" style="background:#d97706"></span>в процессе / ждёт входа</div>
  <div class="row"><span class="dot" style="background:#dc2626"></span>блокер / риск</div>
  <div class="row"><span class="dot" style="background:#6d28d9"></span>цвет зоны — направление работы</div>
  <div class="src">источники: PRODUCT-VISION.md · STATE.md · HANDOFF.md · TASKS.md · данные на 22.08.2026</div>
</div>

<script>
"use strict";

const HUBX = 1700, HUBY = 1130;
const STATUS = { g:"#16a34a", w:"#d97706", r:"#dc2626" };

const DATA = {
  hub: {
    title: "PROXIMA AI",
    sub: "AI Daily Manager для WB-кабинетов",
    chain: "M1 данные → M2 менеджер → M3 SaaS",
    date: "карта проекта · 22 августа 2026"
  },
  zones: [
    {
      id:"strategy", side:"L", color:"#2563eb", title:"Куда идём · стратегия",
      items:[
        { t:"M1 · Data Foundation — идёт сейчас\nverified-данные пилота Богатовой: WB-артефакты → SHA-256 → PostgreSQL; фазы 2-8, сейчас Phase 2", s:"w" },
        { t:"M2 · AI Daily Manager (внутренний)\nкаждое утро: сигналы + LLM-диагноз (причина, альтернативы, SourceRef) + Decision Inbox; read-only, человек выполняет" },
        { t:"M3 · SaaS на 50+ кабинетов\nmulti-tenant, биллинг, onboarding через Client Passport; открывается после V3" },
        { t:"Гейты: V1 первый сквозной сигнал (цель 1-2 мес) → V2 портфель 3-5 кабин → V3 клиент платит (цель 6 мес)" },
        { t:"Экономика: pricing 10-20k ₽/кабинет/мес; ниша свободна (Sirena AI от 490 ₽, JVO 22.9-54k ₽); пилот Богатовой бесплатно до V3" },
        { t:"Боль (интервью 16.08): AM тратит >60 мин/день на один кабинет; главная боль — интерпретация, а не сбор" }
      ]
    },
    {
      id:"done", side:"R", color:"#16a34a", title:"Что уже сделано",
      items:[
        { t:"Phase 1 полностью: архитектура, provenance, import baseline; 3/3 кросс-модели ревью, 0 блокеров", s:"g" },
        { t:"Phase 2 частично: планы 02-01 + 02-01A; staging-срез: маржа, OOS-сигнал, Telegram-доставка; hosted CI verify PASS", s:"g" },
        { t:"Коллектор: отмена зависших WB-runs, cancel detached branches, rate-limit headers в raw evidence (1a211c9)", s:"g" },
        { t:"VPS Selectel жив: Postgres 16.10, host monitor → Telegram с 15.08", s:"g" },
        { t:"M2-бэклог: 28 задач в новом Jira-проекте PMM; двойной бэклог PA-37 найден и закрыт 17.08", s:"g" },
        { t:"SSH к VPS восстановлен 22.08: алиасы proxima / proxima-db, диагностика ssh-doctor", s:"g" },
        { t:"AI-OS агентов: AGENTS.md, reviewer-субагент, единый verify-контракт make verify", s:"g" }
      ]
    },
    {
      id:"tracks", side:"L", color:"#6366f1", title:"Потоки работы · треки",
      items:[
        { t:"Трек A · Data Foundation — M1 фазы 2-8; Jira PA-36", s:"w" },
        { t:"Трек B · Value — ПРИОРИТЕТ: web-кабинет v0, сценарии W1→W4, LLM-слой, verification; Jira PMM", s:"w" },
        { t:"Трек C · Discovery — AM + клиентские интервью, решение по Torgstat; PA-35" },
        { t:"Трек D · SaaS-readiness — заморожен до V3; PA-34" },
        { t:"Правило конфликтов: B > C > A, но A не останавливается" },
        { t:"Волны M2: W1 качество/продажи/OOS → W2 DRR/заказы/маржа → W3 отзывы/акции/контент → W4 P&L + прогноз поставок" }
      ]
    },
    {
      id:"modules", side:"R", color:"#0891b2", title:"Модули системы",
      items:[
        { t:"Collector · TypeScript (Node 22) — только WB READ, cancellation, rate-limit" },
        { t:"Control-plane · Python 3.14 через uv" },
        { t:"PostgreSQL 16 на VPS — миграции additive-only; локально доступ через SSH-туннель :5433" },
        { t:"Contracts — JSON Schema → make codegen; TS-типы генерируются, руками не правятся" },
        { t:"M2-слой (строится): web-кабинет GYR + Decision Inbox; LLM-диагнозы + независимый reviewer с правом BLOCK с дня 1" },
        { t:"Scenario engine — импорт из Опрос-v2.2 по allowlist + SHA-256 (PA-39); блокирует весь W1-срез", s:"r" }
      ]
    },
    {
      id:"stuck", side:"L", color:"#d97706", title:"Где мы · где застряли",
      items:[
        { t:"Позиция: Phase 2 из 8, прогресс 13%, требований 6/32; в PMM идёт Sprint 0", s:"w" },
        { t:"БЛОК: официальная XLSX-выгрузка кабинета — план 02-02 стоит, ждёт Mike", s:"r" },
        { t:"БЛОК: боевой токен Богатовой — нужен к Phase 4 (тестовый Амировой жив до 2027-02-01)", s:"r" },
        { t:"БЛОК: PA-39 аудит scenario engine → PA-41 импорт → стоит весь W1-срез", s:"r" },
        { t:"Ждут решений Mike: Data GO и Live Deploy GO — отдельные гейты", s:"w" },
        { t:"Ждут Mike: 4 компонента в Jira PMM UI (governance, w1-slice, delivery, finance) — MCP их создать не может", s:"w" }
      ]
    },
    {
      id:"risks", side:"R", color:"#dc2626", title:"Риски",
      items:[
        { t:"Качество данных — причина прошлого провала продукта. Защита: verified-only, SHA-256 provenance, LLM не считает метрики, reviewer BLOCK" },
        { t:"Bus factor: Mike 10-20 ч/нед + бот; AI-ops аналитик ещё в найме" },
        { t:"WB-токены живут ~180 дней — ротация вручную по календарю (решение D11)" },
        { t:"LLM egress с VPS не проверен — проверять до выбора моделей (PMM-31)" },
        { t:"Два исполнителя (бот + агент) — коллизии на main; git fetch перед каждой записью" },
        { t:"Нет локального Docker — весь DB-dev через SSH-туннель на staging" },
        { t:"Отложенные решения: B6 миграции (Ph3), C9 endpoints/RPS (Ph4), RTO/RPO и бэкапы (Ph7)" }
      ]
    },
    {
      id:"next", side:"B", color:"#ea580c", title:"Следующие шаги",
      items:[
        { t:"От Mike: XLSX пилота · боевой токен · слоты интервью · онбординг AI-ops · COGS Богатовой · 4 компонента PMM · прочитать и закрыть PMM-30", s:"r" },
        { t:"От бота: PMM-29 контракты сигналов → PMM-31 LLM-доступ (egress первым делом) → спайки PMM-2 (налоги) и PMM-14 (Build vs Buy)", s:"w" },
        { t:"Трек A: подтвердить закрытие COLLECTOR-WB-BRANCHES; зелёный CI-прогон", s:"w" },
        { t:"Трек B: PA-39 аудит scenario engine → PA-41 импорт → W1 web-кабинет", s:"w" }
      ]
    }
  ]
};

/* ---------- построение DOM ---------- */
const world = document.getElementById("world");
const svg = document.getElementById("edges");
const viewport = document.getElementById("viewport");

const hubEl = document.createElement("div");
hubEl.className = "hub";
hubEl.innerHTML =
  "<h1>" + DATA.hub.title + "</h1>" +
  "<div class='sub'>" + DATA.hub.sub + "</div>" +
  "<div class='chain'>" + DATA.hub.chain + "</div>" +
  "<div class='date'>" + DATA.hub.date + "</div>";
world.appendChild(hubEl);

const zones = [];
let movedFar = false;

DATA.zones.forEach(function(z){
  const el = document.createElement("div");
  el.className = "zone";
  el.dataset.side = z.side;
  el.style.setProperty("--zc", z.color);

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML =
    "<span>" + z.title + "</span>" +
    "<span class='meta'><span class='cnt'>" + z.items.length + "</span><span class='chev'>▾</span></span>";

  const items = document.createElement("div");
  items.className = "items";
  z.items.forEach(function(it){
    const d = document.createElement("div");
    d.className = "item";
    d.textContent = it.t;
    d.style.borderLeftColor = STATUS[it.s] || "var(--zc)";
    items.appendChild(d);
  });

  el.appendChild(head);
  el.appendChild(items);
  world.appendChild(el);

  const rec = { id:z.id, side:z.side, color:z.color, el:el, headEl:head, itemsEl:items, collapsed:false };
  head.addEventListener("click", function(){
    if (movedFar) return;
    rec.collapsed = !rec.collapsed;
    items.style.display = rec.collapsed ? "none" : "";
    head.classList.toggle("collapsed", rec.collapsed);
    layout();
    syncAllBtn();
  });
  zones.push(rec);
});

/* ---------- раскладка ---------- */
function layout(){
  hubEl.style.left = (HUBX - hubEl.offsetWidth / 2) + "px";
  hubEl.style.top  = (HUBY - hubEl.offsetHeight / 2) + "px";
  const gapX = hubEl.offsetWidth / 2 + 90;
  const gapY = 56;
  const colBottom = { L:0, R:0 };

  ["L","R"].forEach(function(side){
    const list = zones.filter(function(z){ return z.side === side; });
    const heights = list.map(function(z){ return z.el.offsetHeight; });
    const total = heights.reduce(function(a,b){ return a+b; }, 0) + gapY * (list.length - 1);
    let y = Math.max(60, HUBY - total / 2);
    list.forEach(function(z, i){
      if (side === "L") z.el.style.left = (HUBX - gapX - z.el.offsetWidth) + "px";
      else              z.el.style.left = (HUBX + gapX) + "px";
      z.el.style.top = y + "px";
      y += heights[i] + gapY;
    });
    colBottom[side] = y - gapY;
  });

  let by = Math.max(HUBY + hubEl.offsetHeight / 2, colBottom.L, colBottom.R) + 90;
  zones.filter(function(z){ return z.side === "B"; }).forEach(function(z){
    z.el.style.left = (HUBX - z.el.offsetWidth / 2) + "px";
    z.el.style.top = by + "px";
    by += z.el.offsetHeight + gapY;
  });

  drawEdges();
}

function drawEdges(){
  let out = "";
  zones.forEach(function(z){
    const h = z.headEl;
    const hx = z.el.offsetLeft, hy = z.el.offsetTop;
    const ax0 = hx + h.offsetLeft, ay0 = hy + h.offsetTop;
    const hw = h.offsetWidth, hh = h.offsetHeight;
    let ax, ay, path;
    if (z.side === "L"){
      ax = ax0 + hw; ay = ay0 + hh / 2;
      const mx = (ax + HUBX) / 2;
      path = "M " + HUBX + " " + HUBY + " C " + mx + " " + HUBY + ", " + mx + " " + ay + ", " + ax + " " + ay;
    } else if (z.side === "R"){
      ax = ax0; ay = ay0 + hh / 2;
      const mx = (ax + HUBX) / 2;
      path = "M " + HUBX + " " + HUBY + " C " + mx + " " + HUBY + ", " + mx + " " + ay + ", " + ax + " " + ay;
    } else {
      ax = ax0 + hw / 2; ay = ay0;
      const my = (ay + HUBY) / 2;
      path = "M " + HUBX + " " + HUBY + " C " + HUBX + " " + my + ", " + ax + " " + my + ", " + ax + " " + ay;
    }
    out += "<path d='" + path + "' fill='none' stroke='" + z.color + "' stroke-width='3' stroke-linecap='round' opacity='0.72'/>";
  });
  svg.innerHTML = out;
}

/* ---------- зум и панорама ---------- */
let scale = 1, tx = 0, ty = 0;
function apply(){ world.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")"; }

function zoomAt(px, py, f){
  const ns = Math.min(3, Math.max(0.05, scale * f));
  const wx = (px - tx) / scale, wy = (py - ty) / scale;
  scale = ns;
  tx = px - wx * scale;
  ty = py - wy * scale;
  apply();
}

function contentBounds(){
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  [hubEl].concat(zones.map(function(z){ return z.el; })).forEach(function(el){
    minX = Math.min(minX, el.offsetLeft);
    minY = Math.min(minY, el.offsetTop);
    maxX = Math.max(maxX, el.offsetLeft + el.offsetWidth);
    maxY = Math.max(maxY, el.offsetTop + el.offsetHeight);
  });
  return { minX:minX, minY:minY, w:maxX - minX, h:maxY - minY };
}

function fit(){
  const b = contentBounds();
  scale = Math.min((innerWidth - 90) / b.w, (innerHeight - 170) / b.h, 1.1);
  tx = (innerWidth  - b.w * scale) / 2 - b.minX * scale;
  ty = (innerHeight - b.h * scale) / 2 - b.minY * scale + 12;
  apply();
}

viewport.addEventListener("wheel", function(e){
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive:false });

let dragging = false, lastX = 0, lastY = 0;
viewport.addEventListener("pointerdown", function(e){
  dragging = true; movedFar = false;
  lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add("dragging");
  viewport.setPointerCapture(e.pointerId);
});
viewport.addEventListener("pointermove", function(e){
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 4) movedFar = true;
  tx += dx; ty += dy;
  lastX = e.clientX; lastY = e.clientY;
  apply();
});
viewport.addEventListener("pointerup", function(){
  dragging = false;
  viewport.classList.remove("dragging");
  setTimeout(function(){ movedFar = false; }, 0);
});

/* ---------- кнопки ---------- */
const btnFit = document.getElementById("btnFit");
const btnIn = document.getElementById("btnIn");
const btnOut = document.getElementById("btnOut");
const btnAll = document.getElementById("btnAll");

btnFit.addEventListener("click", fit);
btnIn.addEventListener("click", function(){ zoomAt(innerWidth / 2, innerHeight / 2, 1.25); });
btnOut.addEventListener("click", function(){ zoomAt(innerWidth / 2, innerHeight / 2, 0.8); });

function syncAllBtn(){
  const anyOpen = zones.some(function(z){ return !z.collapsed; });
  btnAll.textContent = anyOpen ? "свернуть зоны" : "развернуть зоны";
}
btnAll.addEventListener("click", function(){
  const anyOpen = zones.some(function(z){ return !z.collapsed; });
  zones.forEach(function(z){
    z.collapsed = anyOpen;
    z.itemsEl.style.display = anyOpen ? "none" : "";
    z.headEl.classList.toggle("collapsed", anyOpen);
  });
  layout();
  syncAllBtn();
});

/* ---------- старт ---------- */
layout();
fit();
syncAllBtn();
</script>
</body>
</html>
