# Командный override для навыка bmad-prd (PROXIMA AI, 02.09.2026).
# Массивы append-only: базовый finalize_reviewers = [] дополняется записями ниже.
# Каждая запись - отдельный сабагент свежего контекста против prd.md (+ addendum.md);
# отчёт пишется в {doc_workspace}/review-<slug>.md и попадает в validation-report.md/.html.
# Источники внешних чек-листов (все MIT) указаны в шапке каждого файла-промпта.

[workflow]
finalize_reviewers = [
  "skill:bmad-review lenses=adversarial,edge-case-hunter",
  "file:{project-root}/_bmad/custom/reviewers/prd-feasibility-brownfield.md",
  "file:{project-root}/_bmad/custom/reviewers/prd-senior-pm.md",
  "file:{project-root}/_bmad/custom/reviewers/prd-coverage-speckit.md",
  "file:{project-root}/_bmad/custom/reviewers/prd-premortem.md",
]
